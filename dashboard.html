<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | موقع الإحصائيات</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="dashboard-page">

  <!-- شريط علوي -->
  <header class="topbar">
    <div class="topbar-right">
      <img src="assets/images/logo.svg" alt="Logo" class="topbar-logo">
      <span class="topbar-brand">موقع الإحصائيات</span>
    </div>
    <div class="topbar-left">
      <button id="themeToggle" class="icon-btn" title="تبديل الوضع">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <a href="settings.html" class="icon-btn" title="الإعدادات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <div class="user-chip">
        <img id="userAvatar" src="assets/images/avatar.svg" alt="avatar">
        <span id="userName">مستخدم</span>
      </div>
      <button id="logoutBtn" class="btn btn-danger btn-sm">خروج</button>
    </div>
  </header>

  <main class="dashboard-main">
    <!-- ترحيب -->
    <section class="welcome-section">
      <h1>مرحبًا، <span id="welcomeName">صديقي</span> 👋</h1>
      <p>تابع تقدمك الأسبوعي وأنشئ جداولك الخاصة</p>
    </section>

    <!-- العدادات -->
    <section class="stats-grid">
      <div class="stat-card gradient-blue">
        <div class="stat-icon">📋</div>
        <div class="stat-info">
          <span class="stat-label">إجمالي المهام</span>
          <span class="stat-value" id="statTotal">0</span>
        </div>
      </div>
      <div class="stat-card gradient-green">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
          <span class="stat-label">مكتملة</span>
          <span class="stat-value" id="statDone">0</span>
        </div>
      </div>
      <div class="stat-card gradient-orange">
        <div class="stat-icon">⏳</div>
        <div class="stat-info">
          <span class="stat-label">قيد التنفيذ</span>
          <span class="stat-value" id="statPending">0</span>
        </div>
      </div>
      <div class="stat-card gradient-purple">
        <div class="stat-icon">📊</div>
        <div class="stat-info">
          <span class="stat-label">نسبة الإنجاز</span>
          <span class="stat-value" id="statPercent">0%</span>
        </div>
      </div>
    </section>

    <!-- منشئ الجدول -->
    <section class="card">
      <div class="card-header">
        <h2>🗂️ منشئ الجدول المخصص</h2>
        <div class="card-actions">
          <select id="savedTablesSelect" class="select">
            <option value="">— تحميل جدول محفوظ —</option>
          </select>
          <button id="newTableBtn" class="btn btn-secondary btn-sm">جديد</button>
        </div>
      </div>

      <div class="table-builder">
        <label class="field">
          <span>اسم الجدول</span>
          <input type="text" id="tableName" placeholder="مثال: مهام الأسبوع" value="مهام الأسبوع">
        </label>

        <div class="builder-toolbar">
          <button id="addColumnBtn" class="btn btn-secondary btn-sm">+ إضافة عمود</button>
          <button id="addRowBtn" class="btn btn-secondary btn-sm">+ إضافة صف</button>
          <button id="saveTableBtn" class="btn btn-primary btn-sm">💾 حفظ الجدول</button>
          <button id="deleteTableBtn" class="btn btn-danger btn-sm">🗑️ حذف الجدول</button>
        </div>

        <div class="table-wrapper">
          <table id="customTable" class="custom-table">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- بيانات التقدم -->
    <section class="card">
      <div class="card-header">
        <h2>📈 بيانات التقدم</h2>
      </div>
      <div class="progress-list" id="progressList">
        <p class="empty-state">لا توجد بيانات بعد. أضف صفوفًا إلى الجدول أعلاه.</p>
      </div>
    </section>

    <!-- المخططات -->
    <section class="charts-grid">
      <div class="card">
        <div class="card-header"><h2>📊 المخطط العمودي</h2></div>
        <div class="chart-container"><canvas id="barChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>🥧 المخطط الدائري</h2></div>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/table-builder.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
