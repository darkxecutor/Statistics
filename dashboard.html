<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائياتي | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="assets/styles/effects.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-page">
    <!-- شريط علوي -->
    <header class="topbar">
        <div class="topbar-right">
            <img src="assets/images/logo.svg" alt="Logo" class="topbar-logo" onerror="this.style.display='none'">
            <span class="topbar-brand">نظام الأهداف</span>
        </div>
        <div class="topbar-left">
            <a href="settings.html" class="icon-btn" title="الإعدادات">⚙️</a>
            <button id="logoutBtn" class="btn btn-danger btn-sm">خروج</button>
        </div>
    </header>

    <!-- التبويبات -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="daily">📅 اليومي</button>
        <button class="tab-btn" data-tab="weekly">📊 الأسبوعي</button>
        <button class="tab-btn" data-tab="monthly">🏆 الشهري</button>
    </div>

    <main class="dashboard-main">
        <!-- قسم اليومي -->
        <section id="tab-daily" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h2>أهداف اليوم</h2>
                    <span id="currentDateLabel" class="badge">...جاري التحميل</span>
                </div>
                
                <div class="daily-layout">
                    <!-- الفترة الصباحية -->
                    <div class="period-box">
                        <div class="period-header">
                            <h3>🌅 الفترة الصباحية</h3>
                            <button class="btn btn-secondary btn-sm add-task" data-period="morning">+ إضافة</button>
                        </div>
                        <div id="morningList" class="task-list"></div>
                    </div>

                    <!-- الفترة المسائية -->
                    <div class="period-box">
                        <div class="period-header">
                            <h3>🌙 الفترة المسائية</h3>
                            <button class="btn btn-secondary btn-sm add-task" data-period="evening">+ إضافة</button>
                        </div>
                        <div id="eveningList" class="task-list"></div>
                    </div>
                </div>

                <div class="daily-footer">
                    <button id="saveDayBtn" class="btn btn-primary">💾 حفظ اليوم</button>
                </div>
            </div>
        </section>

        <!-- قسم الأسبوعي -->
        <section id="tab-weekly" class="tab-content">
            <div class="charts-grid">
                <div class="card">
                    <div class="card-header"><h2>📊 المخطط العمودي (الأسبوع)</h2></div>
                    <div class="chart-container"><canvas id="weeklyBarChart"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-header"><h2>🥧 المخطط الدائري (الأسبوع)</h2></div>
                    <div class="chart-container"><canvas id="weeklyPieChart"></canvas></div>
                </div>
            </div>
        </section>

        <!-- قسم الشهري -->
        <section id="tab-monthly" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h2>🏆 إنجاز الشهر</h2>
                    <span id="monthRewardStatus" class="badge">جاري الحساب...</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div id="monthlyProgressFill" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <h1 id="monthlyPercentage" style="text-align:center; margin-top:10px;">0%</h1>
                </div>
                <div id="rewardMessage" class="reward-box hidden">
                    🎉 مبروك! لقد تجاوزت 85% من أهدافك. مكافأتك هي: <strong id="rewardText"></strong>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
